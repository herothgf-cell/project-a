<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쌍계 · 제작 에셋 검수</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0d151d;color:#e6e4db}body{margin:0;padding:32px;max-width:1450px;margin:auto}header{border-bottom:1px solid #47515a;padding-bottom:20px;margin-bottom:24px}h1{font-size:27px;margin:10px 0}p{line-height:1.7;color:#bdc6cc}.tag{color:#e2c183;font-size:12px;letter-spacing:.13em}button,select{font:inherit;background:#1d303e;color:#eee;border:1px solid #697b86;border-radius:6px;padding:9px 14px}label{margin-right:20px}section{margin:28px 0;padding:24px;background:#14202a;border:1px solid #354753;border-radius:10px}h2{margin-top:0;font-size:21px}.directions{display:grid;grid-template-columns:repeat(8,minmax(90px,1fr));gap:8px}.cell{text-align:center;background:#202e37;border:1px solid #3b4e59;border-radius:6px;padding:8px 0}.cell canvas{width:100%;max-width:148px;height:auto}.cell span{display:block;color:#b9cbd4;font-size:12px}.status{color:#f0c275}#issues{font-size:14px;line-height:1.8}#error{color:#ff9a91}a{color:#a9d8f0}@media(max-width:850px){body{padding:16px}.directions{grid-template-columns:repeat(4,minmax(60px,1fr))}section{padding:12px}}
</style><script defer src="art-loader.js"></script><script defer src="art-review.js"></script></head>
<body><header><div class="tag">SSANGGYE / ART PRODUCTION / LOCAL REVIEW</div><h1>두 세계의 윤서 · 독립 전신 후보</h1><p>게임용으로 새로 생성한 전신 시트입니다. 컨셉 보드 크롭이 아닙니다.<br>현재 작업 방향은 사용자 승인되었습니다. 대기·걷기 8방향, SE 3연타·회피·시전·피격과 소켓을 검수 중이며, 나머지 동작은 <strong class="status">BLOCKED_ART</strong>입니다. 이 비교 화면은 완료된 vertical slice가 아닙니다.</p><label>표시 크기 <select id="scale"><option value="110">게임 크기 · 110px</option><option value="180">확대 검수 · 180px</option></select></label><label><input type="checkbox" id="pivot" checked> 발 기준선 / 손·검 소켓</label><a href="/">현재 게임 열기</a><p><label>동작 <select id="reviewAction"><option value="walk">걷기 후보</option><option value="attack1">1타 후보</option><option value="attack2">2타 후보</option><option value="attack3">3타 후보</option><option value="dodge">회피 후보</option><option value="cast">시전 후보</option><option value="hit">피격 후보</option></select></label><label>프레임 <input id="reviewFrame" type="range" min="0" max="5" value="0" step="1"></label></p></header>
<label>동작 방향 <select id="reviewFacing"><option value="se">SE</option><option value="s">S</option><option value="sw">SW</option><option value="w">W</option><option value="nw">NW</option><option value="n">N</option><option value="ne">NE</option><option value="e">E</option></select></label>
<p id="error" role="alert"></p><main id="actors"></main><section><h2>미제작 / 검수 대기 목록</h2><p>기능 기반 검사 통과와 아트 승인, 배포 완료는 별개입니다.</p><ul id="issues"></ul></section></body></html>
