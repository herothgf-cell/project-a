name: Test and deploy Ssanggye
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Syntax and simulation tests
        run: npm run check && npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: HTTP browser and real storage regression tests
        run: |
          node server.cjs > /tmp/ssanggye-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser_smoke.py --url=http://127.0.0.1:3000/ --output=browser-results
      - name: Keep browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: browser-results/
          if-no-files-found: ignore
      - name: Prepare browser assets only
        run: |
          mkdir -p site
          cp index.html world.js game.js art.js render.js app.js style.css site/
          touch site/.nojekyll
          printf '{"version":"0.3.0","commit":"%s"}\n' "$GITHUB_SHA" > site/build-info.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified game
        id: deployment
        uses: actions/deploy-pages@v4
