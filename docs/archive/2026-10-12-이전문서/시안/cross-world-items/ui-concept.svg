<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc"><title id="title">성장 및 보유 재화 UI 시안</title><desc id="desc">현실 능력치 배분 화면과 네 가지 보유 재화 목록, 모바일 화면 배치. 정적인 검토 시안이며 버튼과 수치는 예시이다.</desc><style>text{font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif;fill:#e7edf5} .muted{fill:#a9b7cb} .small{font-size:16px} .body{font-size:20px} .label{font-size:24px;font-weight:700}</style><rect width="100%" height="100%" fill="#101925"/><text x="32" y="48" font-size="30">쌍계 · 아이템 성장 UI</text><text x="32" y="79" font-size="18" style="fill:#a9b7cb">정적 시안 / 게임 적용 전 / 잔액·수치는 설명용 예시</text><rect x="32" y="108" width="945" height="530" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="58" y="150" font-size="28">성장</text><rect x="58" y="173" width="130" height="45" rx="14" fill="#254c73" stroke="#71b7ff"/><text x="90" y="203" font-size="21">현실</text><text x="223" y="203" font-size="21" style="fill:#a9b7cb">무림 · 조회</text><text x="58" y="258" font-size="23" style="fill:#71b7ff">능력치</text><text x="195" y="258" font-size="21" style="fill:#a9b7cb">기술</text><text x="295" y="258" font-size="21" style="fill:#a9b7cb">보유 재화</text><text x="58" y="301" font-size="18" style="fill:#a9b7cb">레벨 1 · 레벨업 시 생명 +6 / 기력 +2 / 공격 +1</text><rect x="58" y="321" width="300" height="209" rx="14" fill="#1b293c" stroke="#3c506a"/><g transform="translate(104,372)" stroke="#71b7ff" stroke-width="3" fill="#71b7ff" fill-opacity=".18"><path d="M0 -38 L30 -12 L22 22 L0 38 L-22 22 L-30 -12 Z"/><path d="M0 -38 L-12 -8 L0 38 L12 -8 Z M-30 -12 L30 -12" fill="none"/><path d="M-6 -1 H6 M0 -7 V5" stroke-width="4"/></g><text x="151" y="363" font-size="22">현계 공명석</text><text x="151" y="397" font-size="23" style="fill:#71b7ff">보유 4개</text><text x="78" y="453" font-size="18">무림 탐사에서 획득</text><text x="78" y="487" font-size="18" style="fill:#a9b7cb">현실 능력치에 사용</text><text x="393" y="355" font-size="18" style="fill:#a9b7cb">항목</text><text x="600" y="355" font-size="18" style="fill:#a9b7cb">현재 → 배분 후</text><text x="811" y="355" font-size="18" style="fill:#a9b7cb">사용</text><text x="393" y="405" font-size="21">공격</text><text x="600" y="405" font-size="21">16 → 16</text><rect x="796" y="376" width="126" height="40" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="810" y="405" font-size="20">−   0   +</text><text x="393" y="455" font-size="21">최대 생명</text><text x="600" y="455" font-size="21">120 → 126</text><rect x="796" y="426" width="126" height="40" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="810" y="455" font-size="20">−   1   +</text><text x="393" y="505" font-size="21">최대 기력</text><text x="600" y="505" font-size="21">80 → 80</text><rect x="796" y="476" width="126" height="40" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="810" y="505" font-size="20">−   0   +</text><text x="58" y="579" font-size="18">현계 공명석 1개 사용 · 잔여 3개 · 안전 거점에서 확정</text><rect x="760" y="547" width="185" height="58" rx="14" fill="#254c73" stroke="#71b7ff"/><text x="807" y="584" font-size="21">배분 확정</text><rect x="1000" y="108" width="408" height="530" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="1026" y="150" font-size="23">모바일 · 현재 세계 성장</text><rect x="1026" y="172" width="352" height="43" rx="14" fill="#254c73" stroke="#3c506a"/><text x="1050" y="201" font-size="20">현실       무림 · 조회</text><text x="1026" y="255" font-size="20">능력치   기술   보유 재화</text><rect x="1026" y="277" width="352" height="75" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="1046" y="306" font-size="21">현계 공명석 · 보유 4개</text><text x="1046" y="334" font-size="16" style="fill:#a9b7cb">무림에서 획득 → 현실에서 사용</text><text x="1026" y="395" font-size="23">최대 생명   120 → 126</text><text x="1026" y="432" font-size="21">[ − ]     1포인트     [ + ]</text><text x="1026" y="484" font-size="20">소비 1개 / 잔여 3개</text><rect x="1026" y="509" width="352" height="53" rx="14" fill="#254c73" stroke="#71b7ff"/><text x="1144" y="544" font-size="21">배분 확정</text><text x="1026" y="601" font-size="17" style="fill:#a9b7cb">확인 영역은 스크롤 안에 배치</text><rect x="32" y="662" width="945" height="409" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="58" y="706" font-size="27">보유 재화</text><text x="58" y="739" font-size="18" style="fill:#a9b7cb">사용 세계별로 보기 · 0개인 재화도 표시</text><rect x="58" y="761" width="422" height="115" rx="14" fill="#1b293c" stroke="#3c506a"/><g transform="translate(107,819)" stroke="#71b7ff" stroke-width="3" fill="#71b7ff" fill-opacity=".18"><path d="M0 -38 L30 -12 L22 22 L0 38 L-22 22 L-30 -12 Z"/><path d="M0 -38 L-12 -8 L0 38 L12 -8 Z M-30 -12 L30 -12" fill="none"/><path d="M-6 -1 H6 M0 -7 V5" stroke-width="4"/></g><text x="157" y="796" font-size="21">현계 공명석</text><text x="388" y="796" font-size="22" style="fill:#71b7ff">4개</text><text x="157" y="827" font-size="17" style="fill:#a9b7cb">무림 → 현실 능력치</text><text x="157" y="855" font-size="17" style="fill:#71b7ff">성장으로 이동 →</text><rect x="506" y="761" width="422" height="115" rx="14" fill="#1b293c" stroke="#3c506a"/><g transform="translate(555,819)" fill="none" stroke="#71b7ff" stroke-width="5"><rect x="-32" y="-32" width="64" height="64" rx="12"/><path d="M0 22 V-1 M0 -1 L-20 -20 M0 -1 L20 -20"/><circle cx="0" cy="22" r="5" fill="#71b7ff"/><circle cx="-20" cy="-20" r="5" fill="#71b7ff"/><circle cx="20" cy="-20" r="5" fill="#71b7ff"/></g><text x="605" y="796" font-size="21">현계 전승인</text><text x="836" y="796" font-size="22" style="fill:#71b7ff">1개</text><text x="605" y="827" font-size="17" style="fill:#a9b7cb">무림 → 현실 기술 강화</text><text x="605" y="855" font-size="17" style="fill:#71b7ff">성장으로 이동 →</text><rect x="58" y="891" width="422" height="115" rx="14" fill="#1b293c" stroke="#3c506a"/><g transform="translate(107,949)" stroke="#edc273" stroke-width="3" fill="#edc273" fill-opacity=".18"><path d="M0 -38 L30 -12 L22 22 L0 38 L-22 22 L-30 -12 Z"/><path d="M0 -38 L-12 -8 L0 38 L12 -8 Z M-30 -12 L30 -12" fill="none"/><path d="M-6 -1 H6 M0 -7 V5" stroke-width="4"/></g><text x="157" y="926" font-size="21">무림 공명석</text><text x="388" y="926" font-size="22" style="fill:#edc273">2개</text><text x="157" y="957" font-size="17" style="fill:#a9b7cb">현실 → 무림 능력치</text><text x="157" y="985" font-size="17" style="fill:#edc273">성장으로 이동 →</text><rect x="506" y="891" width="422" height="115" rx="14" fill="#1b293c" stroke="#3c506a"/><g transform="translate(555,949)" fill="none" stroke="#edc273" stroke-width="5"><rect x="-32" y="-32" width="64" height="64" rx="12"/><path d="M0 22 V-1 M0 -1 L-20 -20 M0 -1 L20 -20"/><circle cx="0" cy="22" r="5" fill="#edc273"/><circle cx="-20" cy="-20" r="5" fill="#edc273"/><circle cx="20" cy="-20" r="5" fill="#edc273"/></g><text x="605" y="926" font-size="21">무림 전승인</text><text x="836" y="926" font-size="22" style="fill:#edc273">0개</text><text x="605" y="957" font-size="17" style="fill:#a9b7cb">현실 → 무림 기술 강화</text><text x="605" y="985" font-size="17" style="fill:#edc273">성장으로 이동 →</text><rect x="1000" y="662" width="408" height="409" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="1026" y="706" font-size="25">기술 상세 · 파문</text><text x="1026" y="750" font-size="18">체득: Q 사용 가능 / R 미체득</text><text x="1026" y="791" font-size="22" style="fill:#71b7ff">기술 강화 1/3</text><text x="1026" y="824" font-size="18">절약 운용 · Q 기력 소모 −10%</text><text x="1026" y="869" font-size="22">실전 숙련 8/30</text><text x="1026" y="901" font-size="17" style="fill:#a9b7cb">실제 전투로 상승 · 소비하지 않음</text><text x="1026" y="949" font-size="18" style="fill:#edc273">R 후속 정돈 · 이야기 체득 필요</text><text x="1026" y="986" font-size="18" style="fill:#a9b7cb">4장 구조 후 백련과 실습</text><text x="1026" y="1031" font-size="17" style="fill:#a9b7cb">재화로 미체득 기술을 열지 않음</text></svg>