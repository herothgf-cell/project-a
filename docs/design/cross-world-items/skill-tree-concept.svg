<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc"><title id="title">파문 스킬 트리 UI 검토 시안</title><desc id="desc">현실 파문 Q에서 안정 흡수와 절약 운용으로 갈라지고 R 체득 후 후속 정돈으로 이어진다. 노드를 선택한 뒤 상세 효과와 비용을 확인한다. 첫 재화 1개로 구매 방향을 비교하는 정적 제안이다.</desc><style>text{font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif;fill:#e7edf5} .muted{fill:#a9b7cb}</style><rect width="1440" height="1040" fill="#101925"/><text x="32" y="47" font-size="30">쌍계 · 기술 성장 / 파문</text><text x="32" y="80" font-size="18" style="fill:#a9b7cb">수정 제안 · 첫 1포인트의 선택을 비교하는 정적 시안 · 게임 적용 전</text><rect x="32" y="105" width="1376" height="79" rx="14" fill="#1b293c" stroke="#3c506a"/><rect x="54" y="122" width="113" height="44" rx="14" fill="#254c73" stroke="#71b7ff"/><text x="84" y="152" font-size="21">현실</text><text x="200" y="152" font-size="21" style="fill:#a9b7cb">무림 · 조회</text><text x="430" y="152" font-size="21" style="fill:#a9b7cb">능력치</text><text x="564" y="152" font-size="22" style="fill:#71b7ff">기술</text><text x="665" y="152" font-size="21" style="fill:#a9b7cb">보유 재화</text><text x="1030" y="152" font-size="24" style="fill:#71b7ff">현계 전승인  1개</text><rect x="32" y="207" width="858" height="581" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="58" y="249" font-size="27">파문</text><text x="161" y="249" font-size="20" style="fill:#a9b7cb">반향</text><text x="251" y="249" font-size="20" style="fill:#a9b7cb">봉인</text><text x="535" y="249" font-size="18" style="fill:#a9b7cb">현재 거점: 현실 기지</text><path d="M457 369 V404 H249 V428" fill="none" stroke="#557899" stroke-width="3"/><path d="M457 404 H662 V428" fill="none" stroke="#557899" stroke-width="3"/><path d="M249 557 V583 H457 V612" fill="none" stroke="#557899" stroke-width="3" stroke-dasharray="7 6"/><path d="M662 557 V583 H457" fill="none" stroke="#557899" stroke-width="3" stroke-dasharray="7 6"/><rect x="295" y="282" width="324" height="88" rx="14" fill="#1c3b44" stroke="#76d5bb"/><text x="322" y="316" font-size="23">Q · 충격 흡수</text><text x="322" y="347" font-size="17" style="fill:#76d5bb">이야기로 체득 완료 · 무료</text><rect x="74" y="428" width="349" height="129" rx="14" fill="#254c73" stroke="#71b7ff"/><text x="96" y="463" font-size="23">안정 흡수</text><text x="96" y="496" font-size="21">흡수 판정 0.7 → 0.9초</text><text x="96" y="532" font-size="17" style="fill:#71b7ff">1개 · 구매 가능 · 선택 중</text><rect x="488" y="428" width="349" height="129" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="510" y="463" font-size="23">절약 운용</text><text x="510" y="496" font-size="21">Q 소모 기력 12 → 10</text><text x="510" y="532" font-size="17" style="fill:#71b7ff">1개 · 구매 가능</text><rect x="254" y="612" width="409" height="112" rx="14" fill="#202a36" stroke="#6d7888"/><text x="277" y="647" font-size="23">R · 후속 정돈</text><text x="277" y="678" font-size="18">소모 기력 16 → 14 / 비용 1개</text><text x="277" y="708" font-size="17" style="fill:#edc273">조건: 위 노드 하나 + R 체득</text><text x="59" y="759" font-size="17" style="fill:#a9b7cb">두 갈래는 추후 모두 구매 가능 · 첫 1포인트로 우선순위를 선택</text><rect x="913" y="207" width="495" height="581" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="939" y="250" font-size="26">선택한 강화 · 안정 흡수</text><text x="939" y="290" font-size="20" style="fill:#a9b7cb">예고 대응의 시간 여유를 늘립니다.</text><rect x="939" y="315" width="443" height="107" rx="14" fill="#152231" stroke="#3c506a"/><text x="963" y="349" font-size="19">Q 흡수 판정</text><text x="963" y="393" font-size="32" style="fill:#71b7ff">0.7초   →   0.9초</text><text x="939" y="464" font-size="19" style="fill:#a9b7cb">구매 조건</text><text x="939" y="501" font-size="21" style="fill:#76d5bb">✓ 현실 파문 Q 체득</text><text x="939" y="537" font-size="21" style="fill:#76d5bb">✓ 현실 안전 거점</text><text x="939" y="573" font-size="21" style="fill:#76d5bb">✓ 현계 전승인 1개 보유</text><text x="939" y="623" font-size="20">사용 1개  /  구매 후 잔여 0개</text><rect x="939" y="648" width="443" height="55" rx="14" fill="#254c73" stroke="#71b7ff"/><text x="1082" y="684" font-size="23">강화 확정</text><text x="939" y="750" font-size="17" style="fill:#a9b7cb">다음 전투에서 실제 흡수 성공을 비교</text><rect x="32" y="812" width="858" height="106" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="58" y="850" font-size="23">실전 숙련 8 / 30</text><text x="365" y="850" font-size="21" style="fill:#76d5bb">해당 계열 피해 +3%</text><text x="58" y="888" font-size="18" style="fill:#a9b7cb">다음 단계 10 · 재화로 올리지 않음 · 강화 구매 시 숙련은 그대로</text><rect x="913" y="812" width="495" height="106" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="939" y="850" font-size="21" style="fill:#edc273">R 미체득 · 이야기 조건 안내</text><text x="939" y="888" font-size="18">4장 구조 후 백련과 Q→R 실습</text><text x="32" y="953" font-size="18" style="fill:#a9b7cb">잠금 표기: 재화 부족 → 획득처  /  미체득 → 이야기 안내  /  다른 세계 → 해당 거점 안내</text><text x="32" y="990" font-size="17" style="fill:#a9b7cb">수치는 비교용 제안이며 할인 전 기본값 기준입니다. 기존 기술 변형·패시브와의 합산은 기획 검토 후 확정합니다.</text></svg>