<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">두 세계 성장 아이템 4종 콘셉트</title><desc id="desc">A B는 청색 현실 성장 재화, C D는 금색 무림 성장 재화. 능력치는 결정, 기술은 갈래 인장으로 표현한다.</desc><style>text{font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif;fill:#e7edf5} .muted{fill:#a9b7cb} .small{font-size:16px} .body{font-size:20px} .label{font-size:24px;font-weight:700}</style><rect width="100%" height="100%" fill="#101925"/><text x="36" y="55" font-size="30">쌍계 · 두 세계를 잇는 성장 아이템</text><text x="36" y="90" font-size="17" style="fill:#a9b7cb">검토용 콘셉트 · 이름과 형태는 가안 · 게임 적용 전</text><rect x="36" y="120" width="264" height="315" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="56" y="158" font-size="26" style="fill:#71b7ff">A</text><g transform="translate(168,230)" stroke="#71b7ff" stroke-width="3" fill="#71b7ff" fill-opacity=".18"><path d="M0 -38 L30 -12 L22 22 L0 38 L-22 22 L-30 -12 Z"/><path d="M0 -38 L-12 -8 L0 38 L12 -8 Z M-30 -12 L30 -12" fill="none"/><path d="M-6 -1 H6 M0 -7 V5" stroke-width="4"/></g><text x="56" y="317" font-size="23">현계 공명석</text><text x="56" y="354" font-size="17">무림 → 현실 능력치</text><text x="56" y="393" font-size="16" style="fill:#a9b7cb">1개 = 해당 성장 1포인트</text><rect x="326" y="120" width="264" height="315" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="346" y="158" font-size="26" style="fill:#71b7ff">B</text><g transform="translate(458,230)" fill="none" stroke="#71b7ff" stroke-width="5"><rect x="-32" y="-32" width="64" height="64" rx="12"/><path d="M0 22 V-1 M0 -1 L-20 -20 M0 -1 L20 -20"/><circle cx="0" cy="22" r="5" fill="#71b7ff"/><circle cx="-20" cy="-20" r="5" fill="#71b7ff"/><circle cx="20" cy="-20" r="5" fill="#71b7ff"/></g><text x="346" y="317" font-size="23">현계 전승인</text><text x="346" y="354" font-size="17">무림 → 현실 기술 강화</text><text x="346" y="393" font-size="16" style="fill:#a9b7cb">1개 = 해당 성장 1포인트</text><rect x="616" y="120" width="264" height="315" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="636" y="158" font-size="26" style="fill:#edc273">C</text><g transform="translate(748,230)" stroke="#edc273" stroke-width="3" fill="#edc273" fill-opacity=".18"><path d="M0 -38 L30 -12 L22 22 L0 38 L-22 22 L-30 -12 Z"/><path d="M0 -38 L-12 -8 L0 38 L12 -8 Z M-30 -12 L30 -12" fill="none"/><path d="M-6 -1 H6 M0 -7 V5" stroke-width="4"/></g><text x="636" y="317" font-size="23">무림 공명석</text><text x="636" y="354" font-size="17">현실 → 무림 능력치</text><text x="636" y="393" font-size="16" style="fill:#a9b7cb">1개 = 해당 성장 1포인트</text><rect x="906" y="120" width="264" height="315" rx="14" fill="#1b293c" stroke="#3c506a"/><text x="926" y="158" font-size="26" style="fill:#edc273">D</text><g transform="translate(1038,230)" fill="none" stroke="#edc273" stroke-width="5"><rect x="-32" y="-32" width="64" height="64" rx="12"/><path d="M0 22 V-1 M0 -1 L-20 -20 M0 -1 L20 -20"/><circle cx="0" cy="22" r="5" fill="#edc273"/><circle cx="-20" cy="-20" r="5" fill="#edc273"/><circle cx="20" cy="-20" r="5" fill="#edc273"/></g><text x="926" y="317" font-size="23">무림 전승인</text><text x="926" y="354" font-size="17">현실 → 무림 기술 강화</text><text x="926" y="393" font-size="16" style="fill:#a9b7cb">1개 = 해당 성장 1포인트</text><text x="36" y="477" font-size="19" style="fill:#a9b7cb">사용 세계 = 색 + 이름   /   성장 용도 = 결정·인장 형태 + 텍스트</text></svg>